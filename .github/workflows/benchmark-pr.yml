name: Runnel PR benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened]

# PR code is untrusted. Keep this workflow read-only; in particular, do not
# grant it the contents or pull-request write permissions needed to publish a
# comment.
permissions:
  contents: read

concurrency:
  group: runnel-pr-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run short Runnel benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BENCHMARK_PROFILE: pull-request
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Runnel benchmark
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          python3 scripts/benchmarks/compare.py \
            --build-runnel \
            --backends runnel \
            --runnel-image runnel:pr \
            --messages 1000 \
            --payload-sizes 100 \
            --cpus 2 \
            --memory 2g \
            --output benchmark-results/pr.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runnel-pr-benchmark-${{ github.run_id }}
          path: benchmark-results/pr.json
          if-no-files-found: error
