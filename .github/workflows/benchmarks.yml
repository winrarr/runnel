name: Cross-broker benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Native broker comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: python3 scripts/benchmarks/compare.py --build-runnel --messages 10000 --payload-sizes 100,1024 --cpus 2 --memory 2g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-broker-benchmark-results
          path: benchmark-results/compare-*.json
          if-no-files-found: warn
