name: Runnel benchmark history

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      messages:
        description: Number of messages per benchmark scenario
        required: false
        default: "10000"
      cluster_messages:
        description: Number of messages per clustered Runnel scenario
        required: false
        default: "200"
      repetitions:
        description: Independent repetitions to aggregate per benchmark suite
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: benchmark-history
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Runnel benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BENCHMARK_PROFILE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      BENCHMARK_MESSAGES: ${{ inputs.messages || '10000' }}
      BENCHMARK_CLUSTER_MESSAGES: ${{ inputs.cluster_messages || '200' }}
      BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '3' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Run single-node Runnel repetitions
        run: |
          set -euo pipefail
          mkdir -p benchmark-results/raw benchmark-results/normalized
          for repetition in $(seq 1 "$BENCHMARK_REPETITIONS"); do
            build_args=()
            if [ "$repetition" -eq 1 ]; then
              build_args+=(--build-runnel)
            fi
            python3 scripts/benchmarks2/compare.py \
              "${build_args[@]}" \
              --backends runnel \
              --runnel-image runnel:bench \
              --messages "$BENCHMARK_MESSAGES" \
              --payload-sizes 100,1024 \
              --cpus 2 \
              --memory 2g \
              --output "benchmark-results/raw/runnel-${repetition}.json"
            python3 scripts/benchmarks2/normalize.py \
              --input "benchmark-results/raw/runnel-${repetition}.json" \
              --output "benchmark-results/normalized/runnel-repetition-${repetition}.json"
          done
          python3 scripts/benchmarks2/aggregate.py \
            --inputs benchmark-results/normalized/runnel-repetition-*.json \
            --output benchmark-results/normalized/runnel-aggregate.json
      - name: Run clustered Runnel repetitions
        run: |
          set -euo pipefail
          mkdir -p benchmark-results/raw benchmark-results/normalized benchmark-results/logs
          for repetition in $(seq 1 "$BENCHMARK_REPETITIONS"); do
            build_args=()
            if [ "$repetition" -eq 1 ]; then
              build_args+=(--build)
            fi
            python3 scripts/benchmarks2/cluster.py \
              "${build_args[@]}" \
              --binary target/release/runnel \
              --messages "$BENCHMARK_CLUSTER_MESSAGES" \
              --warmup 100 \
              --concurrency 2 \
              --payload-sizes 100,1024 \
              --output "benchmark-results/raw/cluster-${repetition}.json" \
              --log-dir "benchmark-results/logs/cluster-${repetition}"
            python3 scripts/benchmarks2/normalize.py \
              --input "benchmark-results/raw/cluster-${repetition}.json" \
              --output "benchmark-results/normalized/cluster-repetition-${repetition}.json"
          done
          python3 scripts/benchmarks2/aggregate.py \
            --inputs benchmark-results/normalized/cluster-repetition-*.json \
            --output benchmark-results/normalized/cluster-aggregate.json
      - name: Upload raw and aggregated results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-run-${{ github.run_id }}
          path: benchmark-results
          if-no-files-found: error

  publish:
    name: Update benchmark history
    needs: benchmark
    if: needs.benchmark.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Download benchmark result
        uses: actions/download-artifact@v8.0.1
        with:
          name: benchmark-run-${{ github.run_id }}
          path: benchmark-results
      - name: Append benchmark history
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          git fetch origin benchmark-history || true
          if git show-ref --quiet refs/remotes/origin/benchmark-history; then
            git worktree add --detach history origin/benchmark-history
          else
            git worktree add --detach history
            git -C history switch --orphan benchmark-history
            git -C history rm -rf . >/dev/null 2>&1 || true
            git -C history clean -fdx
          fi
          mkdir -p history/runs
          short_sha="${GITHUB_SHA:0:12}"
          for result in benchmark-results/normalized/*-aggregate.json; do
            run_timestamp=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["generated_at"].replace(":", "").replace("+00:00", "Z"))' "$result")
            suite=$(basename "$result" -aggregate.json)
            cp "$result" "history/runs/${run_timestamp}-${short_sha}-${suite}.json"
          done
          python3 scripts/benchmarks2/build_history.py \
            --runs history/runs \
            --output history/site
          git -C history add runs site
          git -C history \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Record benchmark run ${GITHUB_SHA}" || true
          git -C history push origin HEAD:benchmark-history
