name: Security

on:
  pull_request:
  schedule:
    - cron: 17 4 * * 1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-ubuntu-24.04-${{ runner.arch }}
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Ensure ignored advisory is not active
        run: |
          active_path="$(cargo tree --all-features --all-targets --invert rkyv@0.7.46 2>/dev/null)"
          if [[ -n "${active_path}" ]]; then
            echo "::error::rkyv 0.7.46 is active in the dependency feature graph; remove the exception and resolve the advisory."
            printf '%s\n' "${active_path}"
            exit 1
          fi
      - name: Audit dependencies
        # cargo audit scans the lockfile and reports rust_decimal's inactive optional rkyv
        # dependency. Remove this exception when the lockfile no longer contains the advisory.
        run: cargo audit --ignore RUSTSEC-2026-0235
