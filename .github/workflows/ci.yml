name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.86.7
        with:
          tool: just
      - run: just verify

  integration:
    name: Integration and container smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep the integration target in the repository's conventional location
      # so rust-cache can restore dependency artifacts before the run starts.
      CARGO_TARGET_DIR: target
      RUNNEL_INTEGRATION_IMAGE_READY: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2.9.2
        id: rust-cache
      - name: Report Rust target cache result
        run: echo "Rust target cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: taiki-e/install-action@v2.86.7
        with:
          tool: just
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build integration image with reusable layers
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: runnel:dev
          cache-from: type=gha,scope=runnel-ci
          cache-to: type=gha,mode=max,scope=runnel-ci,ignore-error=true
      - run: just integration
      - name: Capture integration diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p benchmark-results/ci-diagnostics
          {
            date --iso-8601=seconds
            uname -a
            nproc
            free -h
            df -h
            ulimit -a
            ps -eo pid,ppid,stat,etime,%cpu,%mem,cmd --sort=-%cpu
            ss -s
          } > benchmark-results/ci-diagnostics/runner.txt 2>&1
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            benchmark-results/ci-diagnostics
            /tmp/runnel-isolated-*
