name: CI

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verify: ${{ steps.filter.outputs.verify }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/ci-paths.yaml

  verify:
    name: Verify
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.verify == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.25
        with:
          tool: just
      # Product-fit reference workloads are opt-in because their manifest
      # budgets are representative engineering envelopes, not CI SLOs.
      - run: just verify

  integration:
    name: Integration and container smoke tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep the integration target in the repository's conventional location
      # so rust-cache can restore dependency artifacts before the run starts.
      CARGO_TARGET_DIR: target
      RUNNEL_INTEGRATION_IMAGE_READY: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2.9.2
        id: rust-cache
      - name: Report Rust target cache result
        run: |
          echo "Rust target cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: taiki-e/install-action@v2.87.25
        with:
          tool: just
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build integration image with reusable layers
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: runnel:dev
          cache-from: type=gha,scope=runnel-ci
          cache-to: type=gha,mode=max,scope=runnel-ci,ignore-error=true
      # Includes the isolated three-node peer-forwarding container census smoke.
      - run: just integration
      - name: Capture integration diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p benchmark-results/ci-diagnostics
          {
            date --iso-8601=seconds
            uname -a
            nproc
            free -h
            df -h
            ulimit -a
            ps -eo pid,ppid,stat,etime,%cpu,%mem,cmd --sort=-%cpu
            ss -s
          } > benchmark-results/ci-diagnostics/runner.txt 2>&1
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            benchmark-results/ci-diagnostics
            /tmp/runnel-isolated-*
