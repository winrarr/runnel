name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.86.3
        with:
          tool: just
      - run: just verify

  integration:
    name: Integration and container smoke tests
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.86.3
        with:
          tool: just
      - run: just isolated smoke
      - run: just isolated cluster-test
      - run: just docker-build
      - run: just isolated bench-container-smoke
