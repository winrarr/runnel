name: Publish benchmark dashboard

on:
  push:
    branches: [main]
    paths:
      - scripts/benchmarks/build_site.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Update static dashboard branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate static dashboard
        run: |
          python3 scripts/benchmarks/build_site.py \
            --runs benchmark-results \
            --output generated-page \
            --index-only \
            --data-url https://raw.githubusercontent.com/winrarr/runnel/benchmark-history/site/data.json
      - name: Publish dashboard branch
        run: |
          set -euo pipefail
          git fetch origin benchmark-pages || true
          if git show-ref --quiet refs/remotes/origin/benchmark-pages; then
            git worktree add --detach pages origin/benchmark-pages
          else
            git worktree add --detach pages
            git -C pages switch --orphan benchmark-pages
            git -C pages rm -rf . >/dev/null 2>&1 || true
            git -C pages clean -fdx
          fi
          cp generated-page/index.html pages/index.html
          git -C pages add index.html
          git -C pages \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update benchmark dashboard" || true
          git -C pages push origin HEAD:benchmark-pages
