[workspace]
resolver = "2"
members = [
    "crates/runnel-engine",
    "crates/runnel-test-support",
    "crates/runnel-core",
    "crates/runnel-raft",
    "crates/runnel-protocol",
    "crates/runnel-client",
    "crates/runnel-server",
    "crates/runnel-cli",
]
default-members = ["crates/runnel-server", "crates/runnel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "signal", "io-util", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = "0.8"
x509-parser = "0.18"
sha2 = "0.11"
data-encoding = "2.6"
