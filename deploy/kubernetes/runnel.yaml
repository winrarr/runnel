# Development-only static-cluster manifest. This file intentionally does not
# provide a PodDisruptionBudget, topology spread, backup policy, ServiceMonitor,
# TLS/authentication, storage-capacity policy, or supported rolling upgrade.
# See README.md for the readiness, liveness, persistence, disruption,
# control-plane, resource, metrics, and compatibility assumptions.
apiVersion: v1
kind: Service
metadata:
  name: runnel
spec:
  # Client and HTTP traffic use readiness-filtered endpoints. This Service
  # does not provide TLS, authentication, or a metrics scrape policy.
  selector:
    app.kubernetes.io/name: runnel
  ports:
    - name: broker
      port: 4222
      targetPort: broker
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: runnel-headless
spec:
  # The broker uses these stable DNS names for its static peer list; Raft does
  # not call the Kubernetes API for membership, elections, or recovery.
  clusterIP: None
  selector:
    app.kubernetes.io/name: runnel
  ports:
    - name: broker
      port: 4222
      targetPort: broker
    - name: http
      port: 8080
      targetPort: http
    - name: peer
      port: 7000
      targetPort: peer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runnel
spec:
  serviceName: runnel-headless
  podManagementPolicy: Parallel
  replicas: 3
  # Keep image changes explicit while clustered storage and peer compatibility
  # remain undefined. Delete/restart one pod at a time for experiments.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: runnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runnel
    spec:
      # There is no disruption budget, anti-affinity, or topology spread in
      # this development manifest; keep voluntary disruption to one member.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runnel
          image: runnel:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              node_id="${HOSTNAME##*-}"
              bootstrap_args=""
              if [ "$node_id" = "0" ]; then bootstrap_args="--bootstrap"; fi
              exec /usr/local/bin/runnel \
                --engine raft \
                --node-id "$node_id" \
                --data-dir /var/lib/runnel \
                --listen 0.0.0.0:4222 \
                --http-listen 0.0.0.0:8080 \
                --peer-listen 0.0.0.0:7000 \
                --cluster-node 0=runnel-0.runnel-headless:7000 \
                --cluster-node 1=runnel-1.runnel-headless:7000 \
                --cluster-node 2=runnel-2.runnel-headless:7000 \
                $bootstrap_args
          ports:
            - name: broker
              containerPort: 4222
            - name: http
              containerPort: 8080
            - name: peer
              containerPort: 7000
          startupProbe:
            # /health/live checks only that the HTTP handler responds. The
            # process opens the engine before binding this listener, so the
            # startup window covers slow persistent-state recovery.
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            # /health/ready checks initialized Raft metadata and an elected
            # leader through the engine health path; it is not local-leader,
            # replication-lag, quorum-margin, or disk-capacity validation.
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Liveness intentionally does not restart a node merely because
            # the engine is not ready or the cluster has no leader.
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # Illustrative per-pod values; they are not measured capacity
            # guidance and do not reserve or limit persistent storage.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/runnel
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Each ordinal receives an independent claim. The default StorageClass
        # is used because no storageClassName is selected here.
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
